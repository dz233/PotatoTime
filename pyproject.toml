[project]
name = "tomatotime"
version = "0.2.1"
description = "Windows local pomodoro timer and learning journal"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "PySide6>=6.8.1,<7",
]

[project.optional-dependencies]
ai = [
    "httpx>=0.28,<1",
    "keyring>=25,<26",
]

[dependency-groups]
packaging = [
    "pyinstaller>=6.11,<7",
]

[tool.uv]
package = false
